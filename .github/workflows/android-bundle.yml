name: android-bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the version
        id: v
        run: |
          echo "name=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^zedsecure.versionCode=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh android

      - name: Unlock signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          { echo "storeFile=release.keystore"; echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"; echo "keyAlias=$KEY_ALIAS"; } > keystore.properties

      - name: Build the bundle
        run: ./gradlew :app:bundleRelease

      - name: Check the bundle
        run: |
          set -e
          V='${{ steps.v.outputs.name }}'
          src=app/build/outputs/bundle/release/app-release.aab
          [ -f "$src" ] || { echo "::error::$src was not built"; exit 1; }
          mkdir -p dist
          cp "$src" "dist/ZedTunnel-$V.aab"
          unzip -l "dist/ZedTunnel-$V.aab" | awk '/base\/lib\//{print $4}' | sort > libs.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libgojni libtor libobfs4proxy libconjure libsnowflake libsnispoof libhev-socks5-tunnel libopenconnect libzeptun libzeptun-jni; do
              grep -qx "base/lib/$abi/$lib.so" libs.txt || { echo "::error::$abi/$lib.so is not in the bundle"; exit 1; }
            done
          done
          grep -q "base/lib/x86/" libs.txt && { echo "::error::the bundle has x86 libraries without the engines"; exit 1; } || true
          echo "$(wc -l < libs.txt) native libraries in the bundle"
          "$JAVA_HOME/bin/jarsigner" -verify "dist/ZedTunnel-$V.aab" | tail -1
          ( cd dist && sha256sum ZedTunnel-*.aab > SHA256SUMS-aab.txt )
          ls -l dist

      - name: Forget the key
        if: always()
        run: shred -u release.keystore keystore.properties 2>/dev/null || rm -f release.keystore keystore.properties

      - uses: actions/upload-artifact@v7
        with: { name: "android-aab-${{ steps.v.outputs.name }}-${{ steps.v.outputs.code }}", path: dist/*, retention-days: 30 }
